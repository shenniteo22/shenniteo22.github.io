<head>
  <meta charset='utf-8' />

<body>
  <div id='map'></div>
  <!-- Button -->
  <button id="see-list">

  <!-- LIST SIDEBAR -->
  <div id="list-sidebar">

    <h2>Admission</h2>

    <div id="filters">
      <label>
        <input type="radio" name="toggle" value="all" checked>
        All
      </label><br>

      <label>
        <input type="radio" name="toggle" value="FREE">
        Free
      </label><br>

      <label>
        <input type="radio" name="toggle" value="TICKETED">
        Ticketed

  </div>
